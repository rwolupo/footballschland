name: Sanity Studio Deploy

on:
  push:
    branches: [main]
    paths:
      - 'sanity.config.ts'
      - 'sanity.cli.ts'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Deploy Sanity Studio
        run: npx sanity deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
          # Preview-Token für den „Öffne Vorschau"-Button. Muss identisch mit
          # der Netlify-Env SANITY_PREVIEW_TOKEN sein — der Astro-Renderer
          # vergleicht beide Werte, damit der Preview-Modus greift.
          SANITY_STUDIO_PREVIEW_TOKEN: ${{ secrets.SANITY_STUDIO_PREVIEW_TOKEN }}
